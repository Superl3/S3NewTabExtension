<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3 New Tab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-mode" viewBox="0 0 24 24">
        <path d="M9 3h6l1 3 3 1v6l-3 1-1 3H9l-1-3-3-1V7l3-1 1-3z" />
        <circle cx="12" cy="10" r="3.2" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14" />
        <path d="M5 12h14" />
      </symbol>
      <symbol id="i-reset" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 3-6.7" />
        <path d="M3 5v4h4" />
      </symbol>
      <symbol id="i-widget" viewBox="0 0 24 24">
        <rect x="3" y="3" width="8" height="8" rx="1.5" />
        <rect x="13" y="3" width="8" height="5" rx="1.5" />
        <rect x="13" y="10" width="8" height="11" rx="1.5" />
        <rect x="3" y="13" width="8" height="8" rx="1.5" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M10.4 2.8h3.2l.6 2.2c.7.2 1.3.5 1.9.8l2-1.1 2.3 2.3-1.1 2c.3.6.6 1.2.8 1.9l2.2.6v3.2l-2.2.6c-.2.7-.5 1.3-.8 1.9l1.1 2-2.3 2.3-2-1.1c-.6.3-1.2.6-1.9.8l-.6 2.2h-3.2l-.6-2.2c-.7-.2-1.3-.5-1.9-.8l-2 1.1-2.3-2.3 1.1-2a7.8 7.8 0 0 1-.8-1.9l-2.2-.6v-3.2l2.2-.6c.2-.7.5-1.3.8-1.9l-1.1-2 2.3-2.3 2 1.1c.6-.3 1.2-.6 1.9-.8z" />
        <circle cx="12" cy="12" r="2.7" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16" />
        <path d="M9 7V5h6v2" />
        <path d="M7 7l1 12h8l1-12" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24">
        <path d="M3 21l3.7-.7L20 7.1 16.9 4 3.7 17.2 3 21z" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12" />
        <path d="M18 6l-12 12" />
      </symbol>
      <symbol id="i-move" viewBox="0 0 24 24">
        <path d="M12 3v18" />
        <path d="M3 12h18" />
        <path d="M8 7l4-4 4 4" />
        <path d="M8 17l4 4 4-4" />
        <path d="M7 8l-4 4 4 4" />
        <path d="M17 8l4 4-4 4" />
      </symbol>
      <symbol id="i-arrange" viewBox="0 0 24 24">
        <rect x="3" y="4" width="8" height="6" rx="1.2" />
        <rect x="13" y="4" width="8" height="6" rx="1.2" />
        <rect x="3" y="12" width="8" height="8" rx="1.2" />
        <rect x="13" y="12" width="8" height="8" rx="1.2" />
      </symbol>
    </svg>

    <div id="bgLayer" class="bg-layer" aria-hidden="true">
      <img id="bgImage" class="bg-image" alt="" />
      <img id="bgBlurImage" class="bg-blur-image" alt="" />
      <video id="bgVideo" class="bg-video" muted autoplay loop playsinline></video>
      <div id="bgOverlay" class="bg-overlay"></div>
    </div>

    <div id="app">
      <div id="editRail" class="edit-rail" aria-label="Edit controls">
        <div class="edit-peek-zone"></div>
        <div class="edit-dock">
          <button id="modeToggleBtn" class="btn btn-primary dock-btn" title="Toggle edit mode">
            <svg class="icon"><use href="#i-mode"></use></svg>
            <span class="btn-label">Edit Mode</span>
          </button>

          <div class="dock-edit-controls">
            <button id="addWidgetBtn" class="btn dock-btn" title="Add widget">
              <svg class="icon"><use href="#i-plus"></use></svg>
              <span class="btn-label">Add</span>
            </button>

            <button id="resetBtn" class="btn btn-danger dock-btn" title="Reset layout">
              <svg class="icon"><use href="#i-reset"></use></svg>
              <span class="btn-label">Reset</span>
            </button>

            <button id="autoArrangeBtn" class="btn dock-btn" title="Auto arrange widgets">
              <svg class="icon"><use href="#i-arrange"></use></svg>
              <span class="btn-label">Arrange</span>
            </button>

            <button
              id="settingsRailToggleBtn"
              class="btn dock-btn settings-rail-toggle"
              type="button"
              title="Open settings"
              aria-label="Toggle settings panel"
              aria-controls="settingsPanel"
              aria-expanded="false"
            >
              <svg class="icon"><use href="#i-settings"></use></svg>
              <span class="btn-label">Settings</span>
            </button>
          </div>
        </div>
      </div>

      <main class="workspace">
        <section id="board" class="board" aria-label="Widget board"></section>
        <div id="settingsPanelBackdrop" class="settings-panel-backdrop" aria-hidden="true"></div>
        <aside id="settingsPanel" class="settings-panel" aria-label="Widget settings">
          <div class="settings-panel-head">
            <h2>Settings</h2>
            <div class="settings-tabs" role="tablist" aria-label="Settings tabs">
              <button id="tabGlobalBtn" class="settings-tab-btn active" role="tab" aria-selected="true">
                Global
              </button>
              <button id="tabBackgroundBtn" class="settings-tab-btn" role="tab" aria-selected="false">
                Background
              </button>
              <button id="tabProfileBtn" class="settings-tab-btn" role="tab" aria-selected="false">
                Profile
              </button>
            </div>
          </div>
          <div id="settingsContent" class="settings-content">
            <p class="muted">Edit Mode에서 설정을 조정할 수 있습니다.</p>
          </div>
        </aside>
      </main>
    </div>

    <template id="widgetTemplate">
      <article class="widget-card">
        <div class="widget-shell">
          <header class="widget-head drag-handle">
            <div class="widget-title"></div>
            <div class="widget-head-actions">
              <button class="icon-btn widget-select-btn" title="Select widget">
                <svg class="icon"><use href="#i-settings"></use></svg>
              </button>
              <button class="icon-btn widget-remove-btn" title="Remove widget">
                <svg class="icon"><use href="#i-trash"></use></svg>
              </button>
            </div>
          </header>
          <section class="widget-body">
            <div class="widget-content-host">
              <div class="widget-inline-actions">
                <button class="icon-btn widget-drag-btn" title="Move widget">
                  <svg class="icon"><use href="#i-move"></use></svg>
                </button>
                <button class="icon-btn widget-float-select" title="Widget settings">
                  <svg class="icon"><use href="#i-settings"></use></svg>
                </button>
                <button class="icon-btn widget-float-remove" title="Remove widget">
                  <svg class="icon"><use href="#i-trash"></use></svg>
                </button>
              </div>
              <div class="widget-content-slot"></div>
            </div>
          </section>
        </div>
        <div class="widget-resize-handle" title="Resize widget" aria-hidden="true"></div>
      </article>
    </template>

    <div id="widgetModalOverlay" class="widget-modal-overlay" aria-hidden="true">
      <section class="widget-modal" role="dialog" aria-modal="true" aria-label="Widget Settings Modal">
        <header class="widget-modal-head">
          <h3 id="widgetModalTitle">Widget Settings</h3>
          <button id="widgetModalCloseBtn" class="icon-btn" title="Close settings">
            <svg class="icon"><use href="#i-close"></use></svg>
          </button>
        </header>
        <div id="widgetModalBody" class="widget-modal-body"></div>
        <footer class="widget-modal-actions">
          <button id="widgetModalCancelBtn" class="btn">Cancel</button>
          <button id="widgetModalOkBtn" class="btn btn-primary">OK</button>
        </footer>
      </section>
    </div>

    <div id="addWidgetModalOverlay" class="widget-modal-overlay" aria-hidden="true">
      <section class="widget-modal add-widget-modal" role="dialog" aria-modal="true" aria-label="Add Widget Modal">
        <header class="widget-modal-head">
          <h3>Add Widget</h3>
          <button id="addWidgetModalCloseBtn" class="icon-btn" title="Close add widget modal">
            <svg class="icon"><use href="#i-close"></use></svg>
          </button>
        </header>
        <div class="widget-modal-body add-widget-modal-body">
          <label class="form-row" title="Widget type">
            <span>Widget</span>
            <div class="field field-select">
              <svg class="icon"><use href="#i-widget"></use></svg>
              <select id="widgetTypeSelect"></select>
            </div>
          </label>

          <div class="add-widget-size-grid">
            <label class="form-row">
              <span>Width (cols)</span>
              <input id="addWidgetColSpanInput" type="number" min="1" max="16" step="1" value="2" />
            </label>
            <label class="form-row">
              <span>Height (rows)</span>
              <input id="addWidgetRowSpanInput" type="number" min="1" max="24" step="1" value="2" />
            </label>
          </div>
        </div>
        <footer class="widget-modal-actions">
          <button id="addWidgetModalCancelBtn" class="btn">Cancel</button>
          <button id="addWidgetModalOkBtn" class="btn btn-primary">Add</button>
        </footer>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
