<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3 New Tab</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="single-item-surfaces.css" />
    <link rel="stylesheet" href="widget-drag-motion.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-mode" viewBox="0 0 24 24">
        <path d="M9 3h6l1 3 3 1v6l-3 1-1 3H9l-1-3-3-1V7l3-1 1-3z" />
        <circle cx="12" cy="10" r="3.2" />
      </symbol>
      <symbol id="i-spanner" viewBox="0 0 24 24">
        <path d="M20.2 6.2a4.8 4.8 0 0 1-6.4 6.2l-7.9 7.9a2.3 2.3 0 1 1-3.2-3.2l7.9-7.9a4.8 4.8 0 0 1 6.2-6.4l-2.3 2.3.3 2.2 2.2.3z" />
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M4.5 11.2 12 5.2l7.5 6" />
        <path d="M6.7 10.7v8h10.6v-8" />
        <path d="M10.2 18.7v-4.2h3.6v4.2" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14" />
        <path d="M5 12h14" />
      </symbol>
      <symbol id="i-reset" viewBox="0 0 512 512">
        <path stroke-width="48" d="M393 181a149 149 0 1 0 15 132" />
        <path stroke-width="48" d="M393 113v83h-83" />
      </symbol>
      <symbol id="i-open" viewBox="0 0 24 24">
        <path d="M14 5h5v5" />
        <path d="M19 5 10 14" />
        <path d="M7 7h4" />
        <path d="M7 7v10h10v-4" />
      </symbol>
      <symbol id="i-connect" viewBox="0 0 24 24">
        <path d="M8 8v4" />
        <path d="M16 8v4" />
        <path d="M6 12h12" />
        <path d="M9 12v3.6a3 3 0 0 0 6 0V12" />
        <path d="M12 18.6v2" />
        <circle cx="18.2" cy="6.2" r="3" />
        <path d="M18.2 4.8v2.8" />
        <path d="M16.8 6.2H19.6" />
      </symbol>
      <symbol id="i-disconnect" viewBox="0 0 24 24">
        <path d="M8 8v4" />
        <path d="M16 8v4" />
        <path d="M6 12h12" />
        <path d="M9 12v3.6a3 3 0 0 0 6 0V12" />
        <path d="M12 18.6v2" />
        <circle cx="18.2" cy="6.2" r="3" />
        <path d="M17.2 5.2l2 2" />
        <path d="M19.2 5.2l-2 2" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="5.8" />
        <path d="M15 15 20.2 20.2" />
      </symbol>
      <symbol id="i-widget" viewBox="0 0 24 24">
        <rect x="3" y="3" width="8" height="8" rx="1.5" />
        <rect x="13" y="3" width="8" height="5" rx="1.5" />
        <rect x="13" y="10" width="8" height="11" rx="1.5" />
        <rect x="3" y="13" width="8" height="8" rx="1.5" />
      </symbol>
      <symbol id="i-folder-mini" viewBox="0 0 24 24">
        <path d="M3.8 7.2a1.9 1.9 0 0 1 1.9-1.9h4l1.6 1.7h7a1.9 1.9 0 0 1 1.9 1.9v8.4a1.9 1.9 0 0 1-1.9 1.9H5.7a1.9 1.9 0 0 1-1.9-1.9z" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="2.6" />
        <circle cx="12" cy="12" r="6.1" />
        <path d="M12 3.8v2.1" />
        <path d="M12 18.1v2.1" />
        <path d="M5.9 5.9l1.5 1.5" />
        <path d="M16.6 16.6l1.5 1.5" />
        <path d="M3.8 12h2.1" />
        <path d="M18.1 12h2.1" />
        <path d="M5.9 18.1l1.5-1.5" />
        <path d="M16.6 7.4l1.5-1.5" />
      </symbol>
      <symbol id="i-grip" viewBox="0 0 24 24">
        <circle cx="8" cy="5.6" r="1.65" fill="currentColor" stroke="none" />
        <circle cx="8" cy="10.4" r="1.65" fill="currentColor" stroke="none" />
        <circle cx="8" cy="15.2" r="1.65" fill="currentColor" stroke="none" />
        <circle cx="8" cy="20" r="1.65" fill="currentColor" stroke="none" />
        <circle cx="16" cy="5.6" r="1.65" fill="currentColor" stroke="none" />
        <circle cx="16" cy="10.4" r="1.65" fill="currentColor" stroke="none" />
        <circle cx="16" cy="15.2" r="1.65" fill="currentColor" stroke="none" />
        <circle cx="16" cy="20" r="1.65" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16" />
        <path d="M9 7V5h6v2" />
        <path d="M7 7l1 12h8l1-12" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24">
        <path d="M3 21l3.7-.7L20 7.1 16.9 4 3.7 17.2 3 21z" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12" />
        <path d="M18 6l-12 12" />
      </symbol>
      <symbol id="i-move" viewBox="0 0 24 24">
        <path d="M12 4v16" />
        <path d="M4 12h16" />
        <path d="M9.2 6.8 12 4l2.8 2.8" />
        <path d="M9.2 17.2 12 20l2.8-2.8" />
        <path d="M6.8 9.2 4 12l2.8 2.8" />
        <path d="M17.2 9.2 20 12l-2.8 2.8" />
      </symbol>
      <symbol id="i-undo" viewBox="0 0 512 512">
        <path stroke-width="56" d="M166 134 74 228l92 94" />
        <path stroke-width="56" d="M78 228h186c96 0 174 78 174 174" />
      </symbol>
      <symbol id="i-redo" viewBox="0 0 512 512">
        <path stroke-width="56" d="M346 134l92 94-92 94" />
        <path stroke-width="56" d="M434 228H248c-96 0-174 78-174 174" />
      </symbol>
    </svg>

    <div id="bgLayer" class="bg-layer" aria-hidden="true">
      <img id="bgImage" class="bg-image" alt="" />
      <img id="bgBlurImage" class="bg-blur-image" alt="" />
      <video id="bgVideo" class="bg-video" muted autoplay loop playsinline></video>
      <div id="bgOverlay" class="bg-overlay"></div>
    </div>

    <div id="app">
      <div id="editRail" class="edit-rail" aria-label="Edit controls">
        <div class="edit-peek-zone"></div>
        <div class="edit-dock">
          <div class="dock-edit-controls">
            <button id="resetBtn" class="btn btn-danger dock-btn" title="Reset layout">
              <svg class="icon"><use href="#i-reset"></use></svg>
              <span class="btn-label">Reset</span>
            </button>

            <button id="undoBtn" class="btn dock-btn" type="button" title="Undo (Ctrl/Cmd+Z)">
              <svg class="icon"><use href="#i-undo"></use></svg>
              <span class="btn-label">Undo</span>
            </button>

            <button id="redoBtn" class="btn dock-btn" type="button" title="Redo (Ctrl/Cmd+Y)">
              <svg class="icon"><use href="#i-redo"></use></svg>
              <span class="btn-label">Redo</span>
            </button>
          </div>
          <button id="editDockGrip" class="edit-dock-grip" type="button" title="Drag control bar" aria-label="Drag control bar">
            <svg class="icon"><use href="#i-grip"></use></svg>
          </button>
        </div>
      </div>

      <main class="workspace">
        <section id="board" class="board" aria-label="Widget board"></section>
        <div id="dragDeleteZone" class="drag-delete-zone" aria-hidden="true">
          <svg class="icon"><use href="#i-close"></use></svg>
        </div>
        <section id="persistentDock" class="persistent-dock" aria-label="Persistent dock" data-no-page-swipe>
          <div class="persistent-dock-body">
            <div id="dockWidgetStrip" class="dock-widget-strip" role="toolbar" aria-label="Dock widgets"></div>
            <div class="persistent-dock-actions" role="toolbar" aria-label="Dock controls">
              <button id="dockSettingsBtn" class="dock-action-btn dock-settings-btn" type="button" title="Dock settings" aria-label="Dock settings">
                <svg class="icon"><use href="#i-settings"></use></svg>
              </button>
            </div>
          </div>
          <span class="persistent-dock-handle" aria-hidden="true"></span>
        </section>
        <div id="settingsPanelBackdrop" class="settings-panel-backdrop" aria-hidden="true"></div>
        <aside id="settingsPanel" class="settings-panel" aria-label="Widget settings">
          <div class="settings-panel-head">
            <h2>Settings</h2>
            <div class="settings-tabs" role="tablist" aria-label="Settings tabs">
              <button id="tabGlobalBtn" class="settings-tab-btn active" role="tab" aria-selected="true">
                Global
              </button>
              <button id="tabBackgroundBtn" class="settings-tab-btn" role="tab" aria-selected="false">
                Background
              </button>
              <button id="tabProfileBtn" class="settings-tab-btn" role="tab" aria-selected="false">
                Profile
              </button>
            </div>
          </div>
          <div id="settingsContent" class="settings-content">
            <p class="muted">Edit Mode에서 설정을 조정할 수 있습니다.</p>
          </div>
        </aside>

        <button id="addWidgetBtn" class="add-widget-fab" type="button" title="Add widget" aria-label="Add widget">
          <svg class="icon"><use href="#i-plus"></use></svg>
        </button>

        <div id="boardContextMenu" class="board-context-menu" role="menu" aria-label="Board menu" aria-hidden="true">
          <button id="boardContextAddWidgetBtn" class="board-context-menu-item" type="button" role="menuitem">
            <svg class="icon"><use href="#i-plus"></use></svg>
            <span>Add widget</span>
          </button>
        </div>

        <div class="corner-controls-bottom" aria-label="Wallpaper refresh control">
          <button
            id="bgRefreshBtn"
            class="corner-bg-refresh corner-bg-refresh-bottom"
            type="button"
            title="Refresh wallpaper"
            aria-label="Refresh wallpaper"
          >
            <svg class="icon"><use href="#i-reset"></use></svg>
          </button>
        </div>

        <div class="corner-controls-home" aria-label="Home page control">
          <button
            id="homePageAnchorBtn"
            class="corner-home-anchor"
            type="button"
            title="Set current page as home"
            aria-label="Set current page as home"
          >
            <svg class="icon"><use href="#i-home"></use></svg>
          </button>
        </div>

        <div class="corner-controls" aria-label="Quick controls">
          <button
            id="settingsRailToggleBtn"
            class="corner-settings-toggle settings-rail-toggle"
            type="button"
            title="Open settings"
            aria-label="Toggle settings panel"
            aria-controls="settingsPanel"
            aria-expanded="false"
          >
            <svg class="icon"><use href="#i-settings"></use></svg>
          </button>

          <button
            id="modeToggleBtn"
            class="corner-mode-toggle"
            type="button"
            title="Switch to Edit Mode"
            aria-label="Switch to Edit Mode"
          >
            <svg class="icon"><use href="#i-spanner"></use></svg>
          </button>
        </div>
      </main>
    </div>

    <template id="widgetTemplate">
      <article class="widget-card">
        <div class="widget-shell">
          <header class="widget-head drag-handle">
            <div class="widget-title"></div>
            <div class="widget-head-actions">
              <button class="icon-btn widget-select-btn" title="Widget Setting">
                <svg class="icon"><use href="#i-settings"></use></svg>
              </button>
              <button class="icon-btn widget-remove-btn" title="Remove widget">
                <svg class="icon"><use href="#i-trash"></use></svg>
              </button>
            </div>
          </header>
          <div class="widget-inline-actions">
            <button class="icon-btn widget-drag-btn" title="Move widget">
              <svg class="icon"><use href="#i-move"></use></svg>
            </button>
            <button class="icon-btn widget-float-select" title="Widget Setting">
              <svg class="icon"><use href="#i-settings"></use></svg>
            </button>
            <button class="icon-btn widget-float-remove" title="Remove widget">
              <svg class="icon"><use href="#i-trash"></use></svg>
            </button>
          </div>
          <div class="widget-inline-actions-bottom"></div>
          <section class="widget-body">
            <div class="widget-content-host">
              <div class="widget-content-slot"></div>
            </div>
          </section>
        </div>
        <div class="widget-resize-handle" title="Resize widget" aria-hidden="true"></div>
        <div
          class="widget-padding-handle widget-padding-handle-top-right"
          title="Drag to adjust content padding"
          aria-hidden="true"
        ></div>
        <div
          class="widget-padding-handle widget-padding-handle-bottom-left"
          title="Drag to adjust content padding"
          aria-hidden="true"
        ></div>
      </article>
    </template>

    <div id="widgetModalOverlay" class="widget-modal-overlay" aria-hidden="true">
      <section class="widget-modal" role="dialog" aria-modal="true" aria-label="Widget Settings Modal">
        <header class="widget-modal-head">
          <div class="widget-modal-head-top">
            <h3 id="widgetModalTitle">Widget Settings</h3>
            <button id="widgetModalCloseBtn" class="icon-btn" title="Close settings">
              <svg class="icon"><use href="#i-close"></use></svg>
            </button>
          </div>
          <div id="widgetModalTabs" class="widget-modal-tabs" role="tablist" aria-label="Widget settings tabs"></div>
        </header>
        <div id="widgetModalBody" class="widget-modal-body"></div>
        <footer class="widget-modal-actions">
          <button id="widgetModalDefaultBtn" class="btn btn-inverted" type="button">Reset to default</button>
          <button id="widgetModalCancelBtn" class="btn">Cancel</button>
          <button id="widgetModalOkBtn" class="btn btn-primary">OK</button>
        </footer>
      </section>
    </div>

    <div id="widgetTitleRenameOverlay" class="widget-modal-overlay" aria-hidden="true">
      <section class="widget-modal widget-title-rename-modal" role="dialog" aria-modal="true" aria-label="Rename Widget">
        <header class="widget-modal-head">
          <div class="widget-modal-head-top">
            <h3>Rename Widget</h3>
            <button id="widgetTitleRenameCloseBtn" class="icon-btn" title="Close rename modal">
              <svg class="icon"><use href="#i-close"></use></svg>
            </button>
          </div>
        </header>
        <div class="widget-modal-body widget-title-rename-body">
          <label class="form-row widget-title-rename-row">
            <span>Title</span>
            <input id="widgetTitleRenameInput" type="text" maxlength="80" placeholder="Enter widget name" />
          </label>
        </div>
        <footer class="widget-modal-actions">
          <button id="widgetTitleRenameCancelBtn" class="btn" type="button">Cancel</button>
          <button id="widgetTitleRenameOkBtn" class="btn btn-primary" type="button">Apply</button>
        </footer>
      </section>
    </div>

    <div id="dockSettingsModalOverlay" class="widget-modal-overlay" aria-hidden="true">
      <section class="widget-modal dock-settings-modal" role="dialog" aria-modal="true" aria-label="Dock Settings Modal">
        <header class="widget-modal-head">
          <div class="widget-modal-head-top">
            <h3>Dock Settings</h3>
            <button id="dockSettingsModalCloseBtn" class="icon-btn" title="Close dock settings">
              <svg class="icon"><use href="#i-close"></use></svg>
            </button>
          </div>
        </header>
        <div id="dockSettingsModalBody" class="widget-modal-body"></div>
        <footer class="widget-modal-actions">
          <button id="dockSettingsModalDefaultBtn" class="btn btn-inverted" type="button">Reset to default</button>
          <button id="dockSettingsModalCancelBtn" class="btn" type="button">Cancel</button>
          <button id="dockSettingsModalOkBtn" class="btn btn-primary" type="button">Apply</button>
        </footer>
      </section>
    </div>

    <div id="shortcutIconEditorOverlay" class="widget-modal-overlay" aria-hidden="true">
      <section class="widget-modal shortcut-icon-editor-modal" role="dialog" aria-modal="true" aria-label="Shortcut Icon Editor">
        <header class="widget-modal-head">
          <div class="widget-modal-head-top">
            <h3>Shortcut Icon Editor</h3>
            <button id="shortcutIconEditorCloseBtn" class="icon-btn" title="Close icon editor">
              <svg class="icon"><use href="#i-close"></use></svg>
            </button>
          </div>
        </header>
        <div class="widget-modal-body shortcut-icon-editor-body">
          <div class="shortcut-icon-editor-toolbar">
            <label class="form-row">
              <span>Shape</span>
              <select id="shortcutIconEditorShape">
                <option value="roundSquared">Round squared</option>
                <option value="flatSquared">Flat squared</option>
                <option value="round">Round</option>
              </select>
            </label>
            <label class="form-row">
              <span>Icon scale (%)</span>
              <input id="shortcutIconEditorScale" type="range" min="60" max="160" step="5" value="100" />
            </label>
            <label class="form-row">
              <span>Text</span>
              <input id="shortcutIconEditorText" type="text" maxlength="4" placeholder="A, B, 12, etc" />
            </label>
            <label class="form-row">
              <span>Text size</span>
              <input id="shortcutIconEditorFontSize" type="range" min="24" max="92" step="2" value="58" />
            </label>
            <div class="preset-actions">
              <button id="shortcutIconEditorImportBtn" class="btn" type="button">Import image</button>
              <button id="shortcutIconEditorClearBtn" class="btn" type="button">Reset source</button>
            </div>
            <div class="shortcut-icon-editor-source-block">
              <p class="shortcut-icon-editor-source-title">Preset icons</p>
              <div id="shortcutIconEditorPresetGrid" class="shortcut-icon-editor-grid"></div>
            </div>
            <div class="shortcut-icon-editor-source-block">
              <p class="shortcut-icon-editor-source-title">Cached icons</p>
              <div id="shortcutIconEditorCachedGrid" class="shortcut-icon-editor-grid shortcut-icon-editor-grid-cached"></div>
            </div>
            <input id="shortcutIconEditorFile" type="file" accept="image/*" hidden />
          </div>
          <div class="shortcut-icon-editor-canvas-wrap">
            <canvas id="shortcutIconEditorCanvas" width="128" height="128" aria-label="Shortcut icon editor canvas"></canvas>
          </div>
        </div>
        <footer class="widget-modal-actions">
          <button id="shortcutIconEditorCancelBtn" class="btn" type="button">Cancel</button>
          <button id="shortcutIconEditorApplyBtn" class="btn btn-primary" type="button">Apply icon</button>
        </footer>
      </section>
    </div>

    <div id="addWidgetModalOverlay" class="widget-modal-overlay" aria-hidden="true">
      <section class="widget-modal add-widget-modal" role="dialog" aria-modal="true" aria-label="Add Widget Modal">
        <header class="widget-modal-head">
          <div class="widget-modal-head-top">
            <h3>Add Widget</h3>
            <button id="addWidgetModalCloseBtn" class="icon-btn" title="Close add widget modal">
              <svg class="icon"><use href="#i-close"></use></svg>
            </button>
          </div>
        </header>
        <div class="widget-modal-body add-widget-modal-body">
          <label class="form-row" title="Widget type">
            <span>Widget</span>
            <div class="field field-select">
              <select id="widgetTypeSelect"></select>
            </div>
          </label>

          <label class="form-row add-widget-title-row">
            <span>Title (optional)</span>
            <input id="addWidgetTitleInput" type="text" placeholder="Use default widget name" />
          </label>
        </div>
        <footer class="widget-modal-actions">
          <button id="addWidgetModalCancelBtn" class="btn">Cancel</button>
          <button id="addWidgetModalOkBtn" class="btn btn-primary">Add</button>
        </footer>
      </section>
    </div>

    <div id="addWidgetToast" class="app-toast" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
