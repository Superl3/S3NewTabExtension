name: Tests

on:
  push:
    branches:
      - main
      - fix
      - feat/**
      - chore/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Run production readiness checks
        run: npm run test:production

  extension-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Chrome for Testing
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Run real extension smoke
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run smoke:extension -- --headless --no-sandbox
